<script>

  try{
    var p = JSON.parse(localStorage.getItem('uniShellPrefs_v1') || '{}');
    document.documentElement.setAttribute('data-theme', p.theme || 'dark');
  }catch(e){ document.documentElement.setAttribute('data-theme','dark'); }

<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>مساعد TCSS — Top Computer Science Students</title>
<meta name="description" content="شات بوت ذكاء اصطناعي بيجاوب على أسئلتك عن خطط قسم الرياضيات وعلوم الحاسب، كلية العلوم، جامعة الإسكندرية.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#05060b">
<meta name="color-scheme" content="dark light">
<link rel="icon" href="assets/icons/favicon-32.png" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
<link rel="stylesheet" href="assets/app.css?v=2.11.0">
<link rel="stylesheet" href="assets/chat.css?v=2.16.13">
</head>
<body class="chat-body">

<main class="chat-page">
  <div class="chat-layout" id="chatLayout">

    <div class="chat-sidebar-backdrop" id="chatSidebarBackdrop"></div>
    <aside class="chat-sidebar" id="chatSidebar">
      <button class="chat-sidebar-newbtn" id="chatNewChatBtn" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
        <span>محادثة جديدة</span>
      </button>
      <div class="chat-sidebar-section-label">المحادثات الأخيرة</div>
      <div class="chat-sidebar-list" id="chatSidebarList"></div>
    </aside>

    <div class="chat-shell">

      <div class="chat-shell-head">
        <button class="chat-shell-action" id="chatSidebarToggle" type="button" title="إظهار/إخفاء المحادثات" aria-label="إظهار/إخفاء المحادثات">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2.5"/><path d="M9.5 4.5v15"/></svg>
        </button>
        <div class="chat-shell-title">
          <span class="chat-shell-badge" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>
          </span>
          <div>
            <h1>مساعد TCSS</h1>
          </div>
        </div>
        <div class="chat-shell-actions">
          <a class="chat-shell-action" id="chatHomeBtn" href="index.html" title="الرئيسية" aria-label="الرجوع للصفحة الرئيسية">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 9.5V20h13V9.5"/><path d="M9.5 20v-6h5v6"/></svg>
          </a>
          <div class="chat-font-group">
            <button class="chat-shell-action txt" id="chatFontDecBtn" type="button" title="تصغير خط الشات" aria-label="تصغير خط الشات">A−</button>
            <button class="chat-shell-action txt" id="chatFontIncBtn" type="button" title="تكبير خط الشات" aria-label="تكبير خط الشات">A+</button>
          </div>
          <button class="chat-shell-action" id="chatShareBtn" type="button" title="مشاركة المحادثة" aria-label="مشاركة المحادثة">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="M8.6 10.6 15.4 6.4M8.6 13.4l6.8 4.2"/></svg>
          </button>
        </div>
      </div>

      <div class="chat-messages" id="chatMessages" role="log" aria-live="polite"></div>

      <div class="chat-suggestions" id="chatSuggestions">
        <button type="button">كام ساعة مادة الذكاء الاصطناعي؟</button>
        <button type="button">شروط دخول السبيشيال إيه؟</button>
        <button type="button">إزاي أحسب المعدل التراكمي؟</button>
        <button type="button">إيه المتطلب السابق لمادة قواعد البيانات؟</button>
      </div>

      <form class="chat-input-row" id="chatForm">
        <textarea id="chatInput" placeholder="اكتب سؤالك هنا…" rows="1"></textarea>
        <button type="submit" id="chatSendBtn" aria-label="إرسال">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2 11 13"/><path d="M22 2 15 22l-4-9-9-4 20-7z"/></svg>
        </button>
      </form>
      <div class="chat-hint">رد آلي من ذكاء اصطناعي وممكن يغلط أحيانًا — للمعلومات الرسمية راجع صفحة اللائحة</div>
    </div>

  </div>
</main>

<script src="assets/chat.js?v=2.14.1"></script>
</body>
</html>
