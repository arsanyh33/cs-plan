<body>

<div class="bg" aria-hidden="true">
  <div class="bg-aurora"><i></i><i></i><i></i></div>
  <div class="bg-grid"></div>
  <div class="bg-glow"></div>
  <div class="bg-noise"></div>
</div>

<div class="boot" id="boot">
  <div class="boot-in">
    <div class="boot-mark">CS</div>
    <div class="boot-tx">خطتي الأكاديمية</div>
    <div class="boot-sub" id="bootSub">جاري التحضير…</div>
    <div class="boot-bar" id="bootBar"><i></i></div>
  </div>
</div>

<header class="appbar" id="appbar">
  <div class="appbar-in">
    <a class="logo" href="index.html">
      <div class="logo-mark">CS</div>
      <div class="logo-tx">
        <b>خطتي الأكاديمية</b>
        <small>كلية العلوم — إسكندرية</small>
      </div>
    </a>

    <div class="appbar-grow"></div>

    <div class="appbar-tools">
    <!-- حجم الخط — نفس اللي في ملفاتك -->
    <div class="fs-grp">
      <span class="fs-label">حجم الخط</span>
      <div class="fs-segmented">
        <button class="fs-btn" id="fsMinus" title="تصغير الخط" aria-label="تصغير حجم الخط">A−</button>
        <button class="fs-btn" id="fsReset" title="الحجم الافتراضي" aria-label="الحجم الافتراضي">A</button>
        <button class="fs-btn" id="fsPlus"  title="تكبير الخط" aria-label="تكبير حجم الخط">A+</button>
      </div>
    </div>

    <span class="tool-divider" aria-hidden="true"></span>

    <!-- معاينة الأجهزة — نفس اللي في ملفاتك -->
    <select id="deviceSelect" class="tool-select" title="معاينة على جهاز مختلف" aria-label="معاينة على جهاز مختلف">
      <option value="auto">🖥 Auto</option>
      <option value="mobile">📱 Mobile</option>
      <option value="tablet">📲 Tablet</option>
      <option value="laptop">💻 Laptop</option>
    </select>

    <span class="net-dot" id="netDot"><i></i><span>متصل</span></span>
    <button class="icon-btn hide" id="installBtn" title="تثبيت التطبيق" aria-label="تثبيت التطبيق">📲</button>
    <button class="icon-btn" id="shareBtn" title="مشاركة اللينك" aria-label="مشاركة اللينك">🔗</button>
    <button class="icon-btn" id="themeBtn" title="تبديل الوضع" aria-label="تبديل الوضع">☀️</button>
    </div>
  </div>
</header>

<div id="appFrame">
<main>
  <section class="wrap hero">
    <div class="kicker rv">🎓 قسم الرياضيات وعلوم الحاسب</div>
    <h1 class="rv rv-d1">الخطط <span class="grad">الدراسية</span></h1>
  </section>

  <section class="wrap" style="padding-bottom:6px">
    <div class="search rv">
      <input id="searchInput" type="search" inputmode="search" autocomplete="off"
             placeholder="ابحث…" aria-label="بحث">
      <span class="s-ic">🔍</span>
    </div>
    <div class="res hide" id="searchRes"></div>
  </section>

  <section class="wrap sec" id="plans">
    <div class="grid g2 mods" id="modHost"></div>
  </section>
</main>
</div>

<footer class="foot">
  <div class="wrap foot-in">
    <span id="appVer">2.1</span>
    <a href="install.html">التثبيت</a>
    <a href="diagnostics.html">النسخ الاحتياطي</a>
  </div>
</footer>

<!-- زر الرجوع لفوق -->

  <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
    <path d="M12 5l-7 7h4.5v7h5v-7H17z" fill="currentColor"/>
  </svg>
</button>

<script src="assets/inapp.js"></script>
