<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" id="viewportMeta" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>بدون اتصال — Top Computer Science Students</title>
<link rel="icon" href="assets/icons/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="assets/app.css">
</head>
<body>
<main class="wrap" style="min-height:100dvh;display:grid;place-items:center;text-align:center">
  <div style="max-width:460px;padding:24px 0">
    <div style="font-size:3.4rem;margin-bottom:14px">📴</div>
    <h1 style="font-size:clamp(1.4rem,5vw,2rem)">الصفحة دي لسه مش محفوظة</h1>
    <p style="color:var(--muted);margin-top:14px;line-height:1.95">
      التطبيق بيحفظ صفحاته أول مرة تفتحه وإنت متصل بالنت.
      الصفحة اللي طلبتها لسه مانزلتش على جهازك.
    </p>
    <div class="note info" style="margin-top:22px;text-align:start">
      <b>الحل:</b> وصّل النت مرة واحدة، افتح الرئيسية، واستنى لحد ما تشوف رسالة
      <b>«التطبيق بقى شغال بدون نت»</b>. بعد كده كل حاجة هتفتح من غير اتصال.
    </div>
    <div class="btn-row" style="margin-top:22px;justify-content:center">
      <a class="btn primary" href="index.html">◀ الرئيسية</a>
      <button class="btn ghost" onclick="location.reload()">🔄 جرّب تاني</button>
    </div>
    <p style="color:var(--muted2);font-size:.82rem;margin-top:20px" id="netTx"></p>
  </div>
</main>
<script>
(function(){
  var el = document.getElementById('netTx');
  function p(){ el.textContent = navigator.onLine ? '🟢 النت رجع — اضغط «جرّب تاني»' : '🔴 لسه مفيش اتصال'; }
  p(); window.addEventListener('online', p); window.addEventListener('offline', p);
})();
</script>
</body>
</html>
